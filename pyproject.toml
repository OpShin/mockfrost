[project]
name = "plutus-bench"
version = "0.1.0"
description = "Create a mock environment for Plutus Smart Contract transactions."
authors = [{ name = "Niels Mündler", email = "n.muendler@posteo.de" }]
requires-python = ">=3.10, <3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "uplc>=1.3.2",
    "pycardano>=0.17.0",
    "fastapi>=0.110.1",
    "uvicorn>=0.29.0",
    "starlette>=0.37.2",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.1.0",
    "opshin>=0.27.0",
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "opshin>=0.27.0",
    "hypothesis>=6.98.2",
    "parameterized>=0.9.0",
    "black>=24.4.0",
    "pre-commit>=3.3.2",
    "coverage",
    "pytest>=7.3.1",
    "coveralls>=4.0.1",
]

[tool.uv]

[tool.uv.sources]
pycardano = { git = "https://github.com/Python-Cardano/pycardano", rev = "70a7a3b5027eac00b850f0f2b997a141c86fe665" }

[tool.hatch.build.targets.sdist]
include = ["plutus_bench"]

[tool.hatch.build.targets.wheel]
include = ["plutus_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
